apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowlatesttag
spec:
  crd:
    spec:
      names: { kind: K8sDisallowLatestTag }
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowlatesttag

        violation[{"msg": msg}] {
          c := input.review.object.spec.template.spec.containers[_]
          endswith(c.image, ":latest")
          msg := sprintf("Container %v uses :latest tag (image=%v)", [c.name, c.image])
        }

        violation[{"msg": msg}] {
          c := input.review.object.spec.template.spec.containers[_]
          not contains(c.image, ":")
          msg := sprintf("Container %v has no image tag (image=%v)", [c.name, c.image])
        }
